# Settings
settings:
  max_articles_per_feed: 20
  dedup_window_days: 7
  min_relevance_score: 0.3
  exclude_keywords:
    - "광고"
    - "ad"
    - "sponsored"
    - "promo code"
    - "coupon"
    - "프로모션"
    - "할인"
    - "discount"
  refresh_interval_hours: 6
