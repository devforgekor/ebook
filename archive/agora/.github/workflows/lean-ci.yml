name: Lean App CI

on:
  push:
    paths:
      - 'apps/lean/**'
      - 'core/**'
      - '.github/workflows/lean-ci.yml'
  pull_request:
    paths:
      - 'apps/lean/**'
      - 'core/**'
      - '.github/workflows/lean-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r apps/lean/requirements.txt || true
      - name: Run tests
        run: |
          cd apps/lean
          pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Download secrets from Azure Key Vault
        uses: azure/secrets@v1
        with:
          keyvault: ${{ secrets.AZURE_KEYVAULT_NAME }}
          secrets: |
            NOTIFIER_API_KEY
            TELEGRAM_TOKEN
            GEMINI_KEY
      - name: Show secrets (for debug only, remove in prod)
        run: |
          echo "NOTIFIER_API_KEY=${{ env.NOTIFIER_API_KEY }}"
          echo "TELEGRAM_TOKEN=${{ env.TELEGRAM_TOKEN }}"
          echo "GEMINI_KEY=${{ env.GEMINI_KEY }}"
