[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neisync"
version = "0.1.0"
description = "NEIS data collector and API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "flask>=3.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "respx>=0.21.0",
    "pre-commit>=3.5.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = [".venv", "__pycache__", "data", "logs", "export", "temp"]
select = ["E", "F", "I", "B", "N", "C4"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [".venv", "data", "logs", "export", "temp"]
warn_unused_ignores = true

[tool.setuptools.packages.find]
where = ["."]
include = ["neisync*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
